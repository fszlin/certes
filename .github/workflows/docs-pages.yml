name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Certes/**'
      - 'misc/certes.props'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Certes/**'
      - 'misc/certes.props'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pages-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOCFX_VERSION: 2.80.1

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Runtime information
        run: dotnet --info
      - name: Install DocFX
        run: dotnet tool install --tool-path ./.tools docfx --version ${{ env.DOCFX_VERSION }}
      - name: Build documentation site
        run: ./.tools/docfx docs/docfx.json --warningsAsErrors
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
