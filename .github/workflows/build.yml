name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_resilience_integration:
        description: Run the optional Pebble resilience integration check
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Runtime information
        run: dotnet --info
      - name: Build signed library (all targets)
        run: dotnet build src/Certes/Certes.csproj -c Release -p:ContinuousIntegrationBuild=true
      - name: Compile CLI explicitly
        run: dotnet build src/Certes.Cli/Certes.Cli.csproj -p:SkipSigning=true
      - name: Compile both test projects (all test targets)
        run: dotnet build test/Certes.Tests.Integration/Certes.Tests.Integration.csproj -p:SkipSigning=true
      - name: Run offline unit tests (.NET 10)
        # Reuses the preceding build: keep configuration, target, and SkipSigning aligned.
        run: dotnet test test/Certes.Tests/Certes.Tests.csproj -f net10.0 -p:SkipSigning=true --no-build --no-restore
      - name: Record verification scope
        shell: bash
        run: |
          printf '%s\n' \
            '### Build and offline unit-test verification' \
            'Library, CLI, and unit/integration test compilation were checked.' \
            'The entire net10.0 unit suite ran on .NET 10; no test filters or failure suppression.' \
            'Local ACME integration runs in the separate Pebble job; net462 runtime tests were not executed.' >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: Package smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CERTES_PACKAGE_VERSION: 0.0.0-ci-smoke
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Runtime information
        run: dotnet --info
      - name: Run offline unit tests in Release (matches the release workflow)
        run: dotnet test test/Certes.Tests/Certes.Tests.csproj -c Release -f net10.0 -p:SkipSigning=true
      - name: Pack signed library and CLI
        run: |
          dotnet pack src/Certes/Certes.csproj -c Release -p:ContinuousIntegrationBuild=true --output artifacts/packages
          dotnet pack src/Certes.Cli/Certes.Cli.csproj -c Release -p:ContinuousIntegrationBuild=true --output artifacts/packages
      - name: Consume the library package
        run: dotnet run --project scripts/PackageSmoke/PackageSmoke.csproj -c Release -f net10.0
      - name: Consume the library package on .NET 8
        run: dotnet run --project scripts/PackageSmoke/PackageSmoke.csproj -c Release -f net8.0
      - name: Compile .NET 6 consumer against the compatibility asset
        run: dotnet build scripts/PackageSmoke/PackageSmoke.csproj -c Release -f net6.0
      - name: Install and launch the packaged CLI
        shell: bash
        run: |
          dotnet tool install dotnet-certes --version "$CERTES_PACKAGE_VERSION" --tool-path artifacts/tools --add-source artifacts/packages
          artifacts/tools/certes --help

  integration:
    name: Pebble integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Runtime information
        run: dotnet --info
      - name: Start pinned local CA and challenge responder
        run: |
          docker compose -f scripts/Pebble/compose.yml up -d
          bash scripts/Pebble/wait.sh
      - name: Run ACME integration tests
        run: dotnet test test/Certes.Tests.Integration/Certes.Tests.Integration.csproj -f net10.0 -p:SkipSigning=true
      - name: Container diagnostics
        if: failure()
        run: docker compose -f scripts/Pebble/compose.yml logs --no-color
      - name: Stop local CA
        if: always()
        run: docker compose -f scripts/Pebble/compose.yml down

  integration-resilience:
    name: Pebble resilience integration (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_resilience_integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Runtime information
        run: dotnet --info
      - name: Start local CA in resilience mode
        run: |
          docker compose -f scripts/Pebble/compose.yml -f scripts/Pebble/compose.resilience.yml up -d
          bash scripts/Pebble/wait.sh
      - name: Run Generate API integration check in resilience mode
        env:
          CERTES_INTEGRATION_BADNONCE_RETRY_COUNT: 8
        run: dotnet test test/Certes.Tests.Integration/Certes.Tests.Integration.csproj -f net10.0 -p:SkipSigning=true --filter FullyQualifiedName~CanGenerateCertificateHttpWithGenerateApi
      - name: Container diagnostics
        if: failure()
        run: docker compose -f scripts/Pebble/compose.yml -f scripts/Pebble/compose.resilience.yml logs --no-color
      - name: Stop local CA
        if: always()
        run: docker compose -f scripts/Pebble/compose.yml -f scripts/Pebble/compose.resilience.yml down
