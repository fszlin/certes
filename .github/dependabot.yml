version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The smoke consumer uses the locally built package version, not a release.
    exclude-paths:
      - scripts/PackageSmoke/**
    # Keep core runtime dependency floors deliberate. SemVer ignores apply to
    # version updates, not security updates; do not ignore all versions by name.
    ignore:
      # Major migrations are maintainer-driven; security updates still apply.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: BouncyCastle.Cryptography
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: System.Text.Json
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # CLI API/cancellation migration is deferred to v5 (#405).
      - dependency-name: Spectre.Console.Cli
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        # Cryptography updates warrant their own review and interoperability checks.
        exclude-patterns:
          - "BouncyCastle*"
          - "Portable.BouncyCastle"
          # Pre-1.0 CLI releases can require command API migrations.
          - "Spectre.Console.Cli"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
